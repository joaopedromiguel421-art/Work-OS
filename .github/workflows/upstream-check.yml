name: Upstream review

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare pinned upstream heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/upstream-check.mjs --format json
